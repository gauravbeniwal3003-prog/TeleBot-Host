# ==============================================================================
# TeleBot Host - Production Nginx Configuration
# Target: Intel Xeon Platinum 8168 CPU / Ubuntu 24.04.3 LTS
# Handles: HTTP/HTTPS SSL, WebSockets, Cashfree Webhooks, DDoS Protection
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name your-vps-domain.com www.your-vps-domain.com;

    # Redirect HTTP to HTTPS (uncomment after running certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main Web App & Dashboard API
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cashfree Automatic Payment Webhook Route
    location /api/payments/cashfree-webhook {
        limit_req zone=webhook_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000/api/payments/cashfree-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
